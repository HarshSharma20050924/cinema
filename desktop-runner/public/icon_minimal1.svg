<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ultra deep dark background -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#14151b"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>

    <!-- Sleek Minimal Gradient: Pure Cinema Red to Coral Glow -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b"/>
      <stop offset="100%" stop-color="#e50914"/>
    </linearGradient>

    <!-- Soft ambient inner glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#ff1a35" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  
  <!-- Subtle minimalist luxury border highlight -->
  <rect x="4" y="4" width="504" height="504" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Centered Minimalist Emblem: Modern Geometric Cinema Play / Runner Node -->
  <g filter="url(#softGlow)" transform="translate(16, 0)">
    <!-- Sleek Rounded Play Symbol (Minimal, mathematically balanced) -->
    <path d="M 210 160 
             C 210 148, 222 140, 232 146 
             L 348 242 
             C 358 250, 358 262, 348 270 
             L 232 366 
             C 222 372, 210 364, 210 352 
             Z" 
          fill="url(#glyphGrad)"/>
  </g>
</svg>
