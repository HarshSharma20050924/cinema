<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cinema Scraper Studio</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script>
    (function() {
      const origWarn = console.warn;
      console.warn = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('in-browser Babel transformer')) return;
        origWarn.apply(console, args);
      };
    })();
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    :root {
      --bg: #090b10;
      --card-bg: #111622;
      --card-inner: #161d2d;
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: #161d2c;
      --primary: #e50914;
      --primary-hover: #b80710;
      --blue: #2563eb;
      --emerald: #10b981;
      --amber: #f59e0b;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-pill: 999px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .solid-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
    }
    .solid-inner {
      background: var(--card-inner);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--card-border);
    }
    .badge-emerald { background: rgba(16, 185, 129, 0.12); color: #10b981; }
    .badge-blue { background: rgba(37, 99, 235, 0.12); color: #60a5fa; }
    .badge-amber { background: rgba(245, 158, 11, 0.12); color: #fbbf24; }
    .badge-red { background: rgba(229, 9, 20, 0.12); color: #f87171; }
    .badge-muted { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 18px;
      border-radius: var(--radius-pill);
      font-weight: 600;
      font-size: 13px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    .btn-solid {
      background: #182030;
      color: var(--text);
    }
    .btn-solid:hover {
      background: #232c40;
      color: #ffffff;
    }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
    }
    .btn-ghost:hover {
      background: #182030;
      color: #ffffff;
    }
    
    .nav-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-tab:hover {
      background: #182030;
      color: #ffffff;
    }
    .nav-tab.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .pill-selector {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 15px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--card-border);
      background: var(--card-inner);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .pill-selector:hover {
      background: #1f283c;
      color: #ffffff;
    }
    .pill-selector.active {
      background: #ffffff;
      color: #090b10;
      border-color: #ffffff;
    }

    .input-field {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: background 0.15s ease;
    }
    .input-field:focus {
      background: #1a2234;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .input-field::placeholder {
      color: var(--text-sub);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 880px;
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Minimal SVG Icons (no emojis)
    const Icons = {
      Search: () => (
        <svg className="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      ),
      Layers: () => (
        <svg className="icon" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
      ),
      Globe: () => (
        <svg className="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
      ),
      Terminal: () => (
        <svg className="icon" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
      ),
      Play: () => (
        <svg className="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      ),
      Download: () => (
        <svg className="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      ),
      Copy: () => (
        <svg className="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      ),
      Check: () => (
        <svg className="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      ),
      Alert: () => (
        <svg className="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      ),
      ArrowRight: () => (
        <svg className="icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      ),
      ExternalLink: () => (
        <svg className="icon" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      ),
      Refresh: () => (
        <svg className="icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
      ),
      Close: () => (
        <svg className="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      )
    };

    function getApiBase() {
      return '';
    }

    const CORE_EXTENSIONS = [
      { id: 'hdhub4u', name: 'HDHub4u', type: 'global', popularQuery: 'Guntur Kaaram' },
      { id: 'movieBoxWeb', name: 'MovieBox', type: 'global', popularQuery: 'Loki' },
      { id: 'drive', name: 'MoviesDrive', type: 'global', popularQuery: 'Game of Thrones' },
      { id: 'moviesmod', name: 'MoviesMod', type: 'global', popularQuery: 'Stree 2' },
      { id: 'vega', name: 'VegaMovies', type: 'global', popularQuery: 'Jawan' },
      { id: '4khdhub', name: '4kHdHub', type: 'global', popularQuery: 'Fighter' },
      { id: 'katmoviehd', name: 'KatmovieHD', type: 'global', popularQuery: 'Dark' },
      { id: 'custom', name: 'Custom Website URL', type: 'custom', popularQuery: '' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('crawler'); // 'crawler' | 'explorer' | 'custom' | 'diagnostics'
      
      // Crawler State
      const [searchQuery, setSearchQuery] = useState('Game of Thrones');
      const [targetUrl, setTargetUrl] = useState('');
      const [selectedProvider, setSelectedProvider] = useState('hdhub4u');
      const [contentType, setContentType] = useState('auto');
      const [isCrawling, setIsCrawling] = useState(false);
      const [crawlResult, setCrawlResult] = useState(null);
      const [crawlError, setCrawlError] = useState(null);
      const [copiedIdx, setCopiedIdx] = useState(null);

      // Extension Explorer State
      const [explorerSelectedExt, setExplorerSelectedExt] = useState('hdhub4u');
      const [explorerItems, setExplorerItems] = useState([]);
      const [explorerLoading, setExplorerLoading] = useState(false);
      const [selectedItemStructure, setSelectedItemStructure] = useState(null);

      // Custom Website State
      const [customUrl, setCustomUrl] = useState('');
      const [customResult, setCustomResult] = useState(null);
      const [customLoading, setCustomLoading] = useState(false);

      // Diagnostics & Log Console
      const [logEntries, setLogEntries] = useState([]);

      // Video Player Modal
      const [playerModal, setPlayerModal] = useState({ open: false, url: '', title: '', server: '' });

      const addLog = (level, title, message) => {
        const time = new Date().toLocaleTimeString();
        setLogEntries(prev => [{ id: Math.random().toString(), time, level, title, message }, ...prev].slice(0, 80));
      };

      // Trigger Live Deep Crawl
      const handleRunCrawl = async (customLink = null, forcedQuery = null) => {
        setIsCrawling(true);
        setCrawlError(null);
        setCrawlResult(null);

        const q = (forcedQuery !== null ? forcedQuery : searchQuery || '').trim();
        const link = (customLink !== null ? customLink : targetUrl || '').trim();
        
        if (!q && !link) {
          setCrawlError('Please enter a Movie/Series title or paste a direct post URL.');
          setIsCrawling(false);
          return;
        }

        const prov = selectedProvider === 'custom' ? undefined : selectedProvider;
        addLog('info', 'Crawl Started', `Query: "${q}" | URL: "${link}" | Provider: ${selectedProvider}`);

        try {
          const params = new URLSearchParams();
          if (q) params.set('query', q);
          if (link) params.set('url', link);
          if (prov) params.set('provider', prov);
          if (contentType !== 'auto') params.set('contentType', contentType);

          const endpoint = `${getApiBase()}/api/scraper/crawl?${params.toString()}`;
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              query: q,
              url: link,
              provider: prov,
              contentType: contentType !== 'auto' ? contentType : undefined
            })
          });

          const data = await res.json();
          if (!res.ok || data.success === false) {
            throw new Error(data.error || data.message || 'Crawl failed to resolve valid stream mirrors');
          }

          setCrawlResult(data);
          addLog('success', 'Crawl Resolved', `Found ${data.finalMirrors?.length || 0} verified mirrors for "${data.metadata?.cleanTitle || q}"`);
        } catch (err) {
          setCrawlError(err.message);
          addLog('error', 'Crawl Failed', err.message);
        } finally {
          setIsCrawling(false);
        }
      };

      // Load items for Extension Explorer
      const loadExplorerItems = async (provId) => {
        setExplorerLoading(true);
        setSelectedItemStructure(null);
        try {
          const res = await fetch(`${getApiBase()}/api/posts?provider=${provId}&page=1`);
          const data = await res.json();
          setExplorerItems(Array.isArray(data) ? data : (data.posts || []));
          addLog('info', 'Catalog Loaded', `Fetched ${Array.isArray(data) ? data.length : 0} items for ${provId}`);
        } catch (err) {
          addLog('error', 'Catalog Error', `Failed to load catalog for ${provId}: ${err.message}`);
        } finally {
          setExplorerLoading(false);
        }
      };

      useEffect(() => {
        loadExplorerItems(explorerSelectedExt);
      }, [explorerSelectedExt]);

      // Inspect Item Structure
      const inspectItem = async (item) => {
        setSelectedItemStructure({ loading: true, title: item.title });
        try {
          const domainMap = {
            hdhub4u: 'https://hdhub4u.ms',
            vega: 'https://vegamovies.im',
            drive: 'https://moviesdrive.dad',
            moviesmod: 'https://moviesmod.day',
            movieBoxWeb: 'https://moviebox.ph',
            katmoviehd: 'https://katmoviehd.dad',
            '4khdhub': 'https://4khdhub.fit'
          };
          let link = item.link || '';
          if (link && link.startsWith('/')) {
            const b = domainMap[explorerSelectedExt] || 'https://hdhub4u.ms';
            link = `${b.replace(/\/+$/, '')}/${link.replace(/^\/+/, '')}`;
          }

          const params = new URLSearchParams({
            url: link,
            provider: explorerSelectedExt
          });
          const res = await fetch(`${getApiBase()}/api/scraper/crawl?${params.toString()}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: link, provider: explorerSelectedExt })
          });
          const data = await res.json();
          setSelectedItemStructure(data);
        } catch (err) {
          setSelectedItemStructure({ error: err.message });
        }
      };

      // Custom Website Scrape
      const handleCustomScrape = async () => {
        if (!customUrl.trim()) return;
        setCustomLoading(true);
        setCustomResult(null);
        try {
          const res = await fetch(`${getApiBase()}/api/scraper/test-custom`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: customUrl.trim() })
          });
          const data = await res.json();
          setCustomResult(data);
          addLog('info', 'Custom Site Parsed', `Found ${data.mediaLinks?.length || 0} links from ${customUrl}`);
        } catch (err) {
          setCustomResult({ error: err.message });
          addLog('error', 'Custom Site Error', err.message);
        } finally {
          setCustomLoading(false);
        }
      };

      const copyToClipboard = (text, idx) => {
        navigator.clipboard.writeText(text);
        setCopiedIdx(idx);
        setTimeout(() => setCopiedIdx(null), 2000);
      };

      return (
        <div style={{ maxWidth: 1240, margin: '0 auto', padding: '24px 20px 80px' }}>
          
          {/* Top Bar */}
          <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24, gap: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <div style={{
                width: 36,
                height: 36,
                borderRadius: 'var(--radius-md)',
                background: 'var(--primary)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                color: '#ffffff',
                fontWeight: 800,
                fontSize: 16
              }}>
                C
              </div>
              <div>
                <h1 style={{ fontSize: 18, fontWeight: 700, letterSpacing: '-0.3px', color: '#ffffff' }}>
                  Scraper Studio
                </h1>
                <p style={{ fontSize: 12, color: 'var(--text-sub)' }}>
                  Extension Link Analyzer & Automated Crawler
                </p>
              </div>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <span className="badge badge-emerald">
                <span className="pulse-dot"></span> Cluster Online
              </span>
              <a href="/admin/" className="btn btn-solid" style={{ fontSize: 12, padding: '7px 14px' }}>
                Admin Panel
              </a>
              <a href="/" target="_blank" className="btn btn-ghost" style={{ fontSize: 12, padding: '7px 14px' }}>
                Web App
              </a>
            </div>
          </header>

          {/* Navigation Tabs */}
          <nav style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 24 }}>
            <button className={`nav-tab ${activeTab === 'crawler' ? 'active' : ''}`} onClick={() => setActiveTab('crawler')}>
              <Icons.Search /> Deep Crawler & URL Tester
            </button>
            <button className={`nav-tab ${activeTab === 'explorer' ? 'active' : ''}`} onClick={() => setActiveTab('explorer')}>
              <Icons.Layers /> Extension Tree Explorer
            </button>
            <button className={`nav-tab ${activeTab === 'custom' ? 'active' : ''}`} onClick={() => setActiveTab('custom')}>
              <Icons.Globe /> Custom Website Studio
            </button>
            <button className={`nav-tab ${activeTab === 'diagnostics' ? 'active' : ''}`} onClick={() => setActiveTab('diagnostics')}>
              <Icons.Terminal /> Diagnostics Console
              {logEntries.filter(l => l.level === 'error').length > 0 && (
                <span className="badge badge-red" style={{ padding: '2px 6px', fontSize: 10 }}>
                  {logEntries.filter(l => l.level === 'error').length}
                </span>
              )}
            </button>
          </nav>

          {/* TAB 1: DEEP CRAWLER */}
          {activeTab === 'crawler' && (
            <div>
              {/* Controls Card */}
              <div className="solid-card" style={{ padding: 24, marginBottom: 24 }}>
                <div style={{ marginBottom: 18 }}>
                  <label style={{ display: 'block', fontSize: 12, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 10, letterSpacing: '0.4px' }}>
                    SELECT EXTENSION SOURCE:
                  </label>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                    {CORE_EXTENSIONS.map(ext => (
                      <button
                        key={ext.id}
                        className={`pill-selector ${selectedProvider === ext.id ? 'active' : ''}`}
                        onClick={() => {
                          setSelectedProvider(ext.id);
                          if (ext.popularQuery && !searchQuery) setSearchQuery(ext.popularQuery);
                        }}
                      >
                        <span>{ext.name}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 16, marginBottom: 18 }}>
                  <div>
                    <label style={{ display: 'block', fontSize: 12, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 8 }}>
                      SEARCH QUERY (MOVIE / SERIES TITLE):
                    </label>
                    <input
                      type="text"
                      className="input-field"
                      placeholder="e.g. Game of Thrones, Guntur Kaaram, Loki..."
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && handleRunCrawl()}
                    />
                  </div>

                  <div>
                    <label style={{ display: 'block', fontSize: 12, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 8 }}>
                      DIRECT POST OR PROTECTOR URL (OPTIONAL):
                    </label>
                    <input
                      type="text"
                      className="input-field mono"
                      placeholder="https://... (hubcloud, greenmotors, katdrive)"
                      value={targetUrl}
                      onChange={e => setTargetUrl(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && handleRunCrawl()}
                    />
                  </div>
                </div>

                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 14 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span style={{ fontSize: 12, color: 'var(--text-sub)', fontWeight: 600 }}>Type Filter:</span>
                    {['auto', 'movie', 'series'].map(t => (
                      <button
                        key={t}
                        className={`btn ${contentType === t ? 'btn-solid' : 'btn-ghost'}`}
                        style={{ padding: '5px 12px', fontSize: 11, textTransform: 'uppercase' }}
                        onClick={() => setContentType(t)}
                      >
                        {t}
                      </button>
                    ))}
                  </div>

                  <button
                    className="btn btn-primary"
                    disabled={isCrawling}
                    onClick={() => handleRunCrawl()}
                    style={{ padding: '11px 24px', fontSize: 13 }}
                  >
                    {isCrawling ? <Icons.Refresh /> : <Icons.Search />}
                    <span>{isCrawling ? 'Crawling Pages...' : 'Start Deep Crawl'}</span>
                  </button>
                </div>
              </div>

              {/* Error Notice */}
              {crawlError && (
                <div className="solid-card" style={{ padding: 18, marginBottom: 24, background: '#1c1317', borderColor: 'rgba(229, 9, 20, 0.4)' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10, color: '#f87171' }}>
                    <Icons.Alert />
                    <span style={{ fontWeight: 700, fontSize: 14 }}>Crawl Notice</span>
                  </div>
                  <p style={{ marginTop: 6, fontSize: 13, color: 'var(--text-muted)' }}>{crawlError}</p>
                </div>
              )}

              {/* Results View */}
              {crawlResult && (
                <div>
                  {/* Metadata Card */}
                  <div className="solid-card" style={{ padding: 22, marginBottom: 24 }}>
                    <div style={{ display: 'flex', gap: 20, flexWrap: 'wrap', alignItems: 'flex-start' }}>
                      {crawlResult.metadata?.poster && (
                        <img
                          src={crawlResult.metadata.poster}
                          alt={crawlResult.metadata?.title}
                          style={{ width: 100, height: 145, objectFit: 'cover', borderRadius: 'var(--radius-sm)' }}
                          onError={e => { e.target.style.display = 'none'; }}
                        />
                      )}
                      <div style={{ flex: 1, minWidth: 260 }}>
                        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 8 }}>
                          <span className="badge badge-emerald">
                            {crawlResult.metadata?.type?.toUpperCase() || 'MEDIA'}
                          </span>
                          <span className="badge badge-blue">
                            Provider: {crawlResult.provider}
                          </span>
                          {crawlResult.finalMirrors?.length > 0 && (
                            <span className="badge badge-emerald">
                              {crawlResult.finalMirrors.length} Verified Mirrors
                            </span>
                          )}
                        </div>

                        <h2 style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>
                          {crawlResult.metadata?.cleanTitle || crawlResult.metadata?.title}
                        </h2>

                        {crawlResult.metadata?.description && (
                          <p style={{ fontSize: 13, color: 'var(--text-muted)', lineHeight: 1.5, marginBottom: 12 }}>
                            {crawlResult.metadata.description}
                          </p>
                        )}

                        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                          {crawlResult.metadata?.sourceUrl && (
                            <a href={crawlResult.metadata.sourceUrl} target="_blank" className="btn btn-solid" style={{ fontSize: 12, padding: '6px 12px' }}>
                              <span>Source Page</span>
                              <Icons.ExternalLink />
                            </a>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Step Trace */}
                  {crawlResult.trace && crawlResult.trace.length > 0 && (
                    <div className="solid-card" style={{ padding: 20, marginBottom: 24 }}>
                      <h3 style={{ fontSize: 13, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 14, letterSpacing: '0.4px' }}>
                        CRAWLER EXECUTION STEPS:
                      </h3>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                        {crawlResult.trace.map((step, idx) => (
                          <div key={idx} className="solid-inner" style={{ padding: '10px 14px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0 }}>
                              <span className="badge badge-muted mono" style={{ fontSize: 10 }}>
                                {idx + 1}
                              </span>
                              <div style={{ minWidth: 0 }}>
                                <span style={{ fontSize: 13, fontWeight: 600 }}>{step.action}</span>
                                {step.target && (
                                  <span className="mono" style={{ fontSize: 11, color: 'var(--text-sub)', marginLeft: 8, overflow: 'hidden', textOverflow: 'ellipsis', display: 'inline-block', maxWidth: 380 }}>
                                    {step.target}
                                  </span>
                                )}
                              </div>
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
                              {step.durationMs && (
                                <span className="mono" style={{ fontSize: 11, color: 'var(--text-sub)' }}>{step.durationMs}ms</span>
                              )}
                              <span className={`badge ${step.status === 'ok' ? 'badge-emerald' : 'badge-amber'}`}>
                                {step.status}
                              </span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Final Direct Streamable Mirrors */}
                  <div className="solid-card" style={{ padding: 22 }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
                      <h3 style={{ fontSize: 15, fontWeight: 700 }}>
                        Resolved Direct Stream Mirrors ({crawlResult.finalMirrors?.length || 0})
                      </h3>
                      <span style={{ fontSize: 12, color: 'var(--text-sub)' }}>
                        Tested for CORS & streaming capability
                      </span>
                    </div>

                    {(!crawlResult.finalMirrors || crawlResult.finalMirrors.length === 0) ? (
                      <div className="solid-inner" style={{ padding: 24, textAlign: 'center', color: 'var(--text-muted)' }}>
                        No direct stream links could be decrypted automatically from this item. Check the trace steps above.
                      </div>
                    ) : (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                        {crawlResult.finalMirrors.map((mirror, idx) => (
                          <div key={idx} className="solid-inner" style={{ padding: 16 }}>
                            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 10, marginBottom: 10 }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                <span className="badge badge-blue">{mirror.server || 'Direct Mirror'}</span>
                                {mirror.quality && <span className="badge badge-muted">{mirror.quality}</span>}
                                {mirror.size && <span className="badge badge-muted mono">{mirror.size}</span>}
                                {mirror.health?.alive && <span className="badge badge-emerald">200 OK</span>}
                                {mirror.health?.latency && <span className="mono" style={{ fontSize: 11, color: 'var(--text-sub)' }}>{mirror.health.latency}ms</span>}
                              </div>

                              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                <button
                                  className="btn btn-solid"
                                  style={{ padding: '6px 14px', fontSize: 12 }}
                                  onClick={() => copyToClipboard(mirror.url, idx)}
                                >
                                  {copiedIdx === idx ? <Icons.Check /> : <Icons.Copy />}
                                  <span>{copiedIdx === idx ? 'Copied' : 'Copy'}</span>
                                </button>

                                <button
                                  className="btn btn-primary"
                                  style={{ padding: '6px 14px', fontSize: 12 }}
                                  onClick={() => setPlayerModal({
                                    open: true,
                                    url: mirror.url,
                                    title: crawlResult.metadata?.cleanTitle || 'Video Stream',
                                    server: mirror.server
                                  })}
                                >
                                  <Icons.Play /> Play
                                </button>

                                <a
                                  href={mirror.url}
                                  target="_blank"
                                  download
                                  className="btn btn-solid"
                                  style={{ padding: '6px 14px', fontSize: 12 }}
                                >
                                  <Icons.Download />
                                </a>

                                <a
                                  href={`vlc://${mirror.url}`}
                                  className="btn btn-ghost"
                                  style={{ padding: '6px 12px', fontSize: 12 }}
                                  title="Open in VLC"
                                >
                                  VLC
                                </a>
                              </div>
                            </div>

                            <div className="mono" style={{ fontSize: 12, color: 'var(--text-sub)', wordBreak: 'break-all', background: '#111622', padding: '8px 12px', borderRadius: 'var(--radius-sm)' }}>
                              {mirror.url}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* TAB 2: EXTENSION TREE EXPLORER */}
          {activeTab === 'explorer' && (
            <div>
              <div className="solid-card" style={{ padding: 22, marginBottom: 24 }}>
                <label style={{ display: 'block', fontSize: 12, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 12, letterSpacing: '0.4px' }}>
                  CHOOSE EXTENSION TO EXPLORE:
                </label>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                  {CORE_EXTENSIONS.filter(e => e.id !== 'custom').map(ext => (
                    <button
                      key={ext.id}
                      className={`pill-selector ${explorerSelectedExt === ext.id ? 'active' : ''}`}
                      onClick={() => setExplorerSelectedExt(ext.id)}
                    >
                      {ext.name}
                    </button>
                  ))}
                </div>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'minmax(300px, 380px) 1fr', gap: 24, alignItems: 'flex-start' }}>
                {/* Catalog Column */}
                <div className="solid-card" style={{ padding: 18 }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
                    <h3 style={{ fontSize: 14, fontWeight: 700 }}>
                      Latest Posts ({explorerItems.length})
                    </h3>
                    <button className="btn btn-ghost" style={{ padding: '4px 8px', fontSize: 12 }} onClick={() => loadExplorerItems(explorerSelectedExt)}>
                      <Icons.Refresh />
                    </button>
                  </div>

                  {explorerLoading ? (
                    <div style={{ padding: 20, textAlign: 'center', color: 'var(--text-sub)', fontSize: 13 }}>
                      Loading catalog...
                    </div>
                  ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8, maxHeight: '680px', overflowY: 'auto' }}>
                      {explorerItems.map((item, idx) => (
                        <div
                          key={idx}
                          className="solid-inner"
                          style={{
                            padding: 12,
                            cursor: 'pointer',
                            background: selectedItemStructure?.title === item.title ? '#1e283c' : undefined
                          }}
                          onClick={() => inspectItem(item)}
                        >
                          <div style={{ fontSize: 13, fontWeight: 600, color: '#ffffff', marginBottom: 4, lineHeight: 1.4 }}>
                            {item.title}
                          </div>
                          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                            <span className="badge badge-muted" style={{ fontSize: 10 }}>{item.type || 'Media'}</span>
                            <span style={{ fontSize: 11, color: 'var(--text-sub)' }}>Inspect <Icons.ArrowRight /></span>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Structure Detail Column */}
                <div className="solid-card" style={{ padding: 22 }}>
                  {!selectedItemStructure ? (
                    <div style={{ padding: 40, textAlign: 'center', color: 'var(--text-sub)', fontSize: 13 }}>
                      Select any post from the left to inspect its complete Season, Episode, and Quality tree structure.
                    </div>
                  ) : selectedItemStructure.loading ? (
                    <div style={{ padding: 40, textAlign: 'center', color: 'var(--text-sub)', fontSize: 13 }}>
                      Analyzing post structure & crawling links...
                    </div>
                  ) : selectedItemStructure.error ? (
                    <div style={{ padding: 20, color: '#f87171', fontSize: 13 }}>
                      {selectedItemStructure.error}
                    </div>
                  ) : (
                    <div>
                      <div style={{ marginBottom: 18, borderBottom: '1px solid var(--card-border)', paddingBottom: 14 }}>
                        <span className="badge badge-emerald" style={{ marginBottom: 8 }}>
                          {selectedItemStructure.metadata?.type?.toUpperCase()}
                        </span>
                        <h2 style={{ fontSize: 18, fontWeight: 700 }}>
                          {selectedItemStructure.metadata?.cleanTitle || selectedItemStructure.metadata?.title}
                        </h2>
                      </div>

                      {/* Quality & Season Groups */}
                      {(() => {
                        const groups = Array.isArray(selectedItemStructure.structure)
                          ? selectedItemStructure.structure
                          : (selectedItemStructure.structure?.qualities || selectedItemStructure.structure?.groups || []);

                        if (groups.length === 0) {
                          return (
                            <div className="solid-inner" style={{ padding: 24, textAlign: 'center' }}>
                              <p style={{ color: 'var(--text-sub)', fontSize: 13, marginBottom: 14 }}>
                                Single stream item or direct post. No sub-episodes detected.
                              </p>
                              {selectedItemStructure.url && (
                                <button
                                  className="btn btn-primary"
                                  onClick={() => {
                                    setActiveTab('crawler');
                                    handleRunCrawl(selectedItemStructure.url);
                                  }}
                                >
                                  Deep Crawl Final Mirrors
                                </button>
                              )}
                            </div>
                          );
                        }

                        return (
                          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                            {groups.map((qGroup, qIdx) => {
                              const epList = qGroup.episodes || [];
                              return (
                                <div key={qIdx} className="solid-inner" style={{ padding: 16 }}>
                                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8, marginBottom: 12 }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                      <span className="badge badge-blue">{qGroup.quality || 'HD'}</span>
                                      {qGroup.size && <span className="badge badge-muted mono">{qGroup.size}</span>}
                                      {qGroup.dub && qGroup.dub !== 'Default Audio' && (
                                        <span className="badge badge-amber">{qGroup.dub}</span>
                                      )}
                                      <span style={{ fontSize: 12, fontWeight: 600, color: '#ffffff' }}>
                                        {qGroup.title}
                                      </span>
                                    </div>
                                    <span style={{ fontSize: 12, color: 'var(--text-sub)' }}>
                                      {epList.length > 0 ? `${epList.length} Episodes` : 'Direct File'}
                                    </span>
                                  </div>

                                  {epList.length > 0 ? (
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(130px, 1fr))', gap: 8 }}>
                                      {epList.map((ep, epIdx) => (
                                        <button
                                          key={epIdx}
                                          className="btn btn-solid"
                                          style={{ padding: '8px 10px', fontSize: 12, justifyContent: 'space-between' }}
                                          title={ep.link}
                                          onClick={() => {
                                            setActiveTab('crawler');
                                            handleRunCrawl(ep.link);
                                          }}
                                        >
                                          <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                                            {ep.title || `Ep ${epIdx + 1}`}
                                          </span>
                                          <Icons.ArrowRight />
                                        </button>
                                      ))}
                                    </div>
                                  ) : (
                                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                      <span style={{ fontSize: 12, color: 'var(--text-sub)' }}>Direct Movie / Single file link</span>
                                      {(qGroup.link || qGroup.directLink) && (
                                        <button
                                          className="btn btn-primary"
                                          style={{ padding: '6px 14px', fontSize: 12 }}
                                          onClick={() => {
                                            setActiveTab('crawler');
                                            handleRunCrawl(qGroup.link || qGroup.directLink);
                                          }}
                                        >
                                          Crawl Mirrors
                                        </button>
                                      )}
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        );
                      })()}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* TAB 3: CUSTOM WEBSITE STUDIO */}
          {activeTab === 'custom' && (
            <div>
              <div className="solid-card" style={{ padding: 24, marginBottom: 24 }}>
                <h2 style={{ fontSize: 16, fontWeight: 700, marginBottom: 6 }}>
                  Custom Website URL Scraper
                </h2>
                <p style={{ fontSize: 13, color: 'var(--text-sub)', marginBottom: 16 }}>
                  Enter any external website URL. The engine will inspect the DOM, identify video streams, download links, and candidate mirrors.
                </p>

                <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                  <input
                    type="url"
                    className="input-field mono"
                    placeholder="https://example.com/movie-post"
                    style={{ flex: 1, minWidth: 280 }}
                    value={customUrl}
                    onChange={e => setCustomUrl(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && handleCustomScrape()}
                  />
                  <button
                    className="btn btn-primary"
                    disabled={customLoading}
                    onClick={handleCustomScrape}
                    style={{ padding: '12px 24px', fontSize: 13 }}
                  >
                    {customLoading ? <Icons.Refresh /> : <Icons.Globe />}
                    <span>{customLoading ? 'Analyzing...' : 'Analyze Website'}</span>
                  </button>
                </div>
              </div>

              {customResult && (
                <div className="solid-card" style={{ padding: 22 }}>
                  <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 14 }}>
                    Analysis Output: {customResult.title || 'Page'}
                  </h3>

                  {customResult.error ? (
                    <div style={{ color: '#f87171', fontSize: 13 }}>{customResult.error}</div>
                  ) : (
                    <div>
                      <div style={{ marginBottom: 16, display: 'flex', gap: 8 }}>
                        <span className="badge badge-emerald">{customResult.mediaLinks?.length || 0} Media Links</span>
                        <span className="badge badge-blue">{customResult.downloadButtons?.length || 0} Download Buttons</span>
                      </div>

                      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                        {(customResult.mediaLinks || []).map((m, idx) => (
                          <div key={idx} className="solid-inner" style={{ padding: 12, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
                            <div className="mono" style={{ fontSize: 12, color: 'var(--text-muted)', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                              {m.url}
                            </div>
                            <button
                              className="btn btn-solid"
                              style={{ padding: '5px 12px', fontSize: 11, flexShrink: 0 }}
                              onClick={() => {
                                setActiveTab('crawler');
                                handleRunCrawl(m.url);
                              }}
                            >
                              Deep Crawl
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* TAB 4: DIAGNOSTICS */}
          {activeTab === 'diagnostics' && (
            <div className="solid-card" style={{ padding: 24 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
                <div>
                  <h2 style={{ fontSize: 16, fontWeight: 700 }}>Diagnostics & Event Log</h2>
                  <p style={{ fontSize: 12, color: 'var(--text-sub)' }}>
                    Real-time network events, WAF blocks, and token decrypt logs
                  </p>
                </div>
                <button className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: 12 }} onClick={() => setLogEntries([])}>
                  Clear Log
                </button>
              </div>

              {logEntries.length === 0 ? (
                <div style={{ padding: 32, textAlign: 'center', color: 'var(--text-sub)', fontSize: 13 }}>
                  No system logs recorded yet. Start a crawl or load a catalog to view trace events.
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, maxHeight: 600, overflowY: 'auto' }}>
                  {logEntries.map(entry => (
                    <div
                      key={entry.id}
                      className="solid-inner"
                      style={{
                        padding: '10px 14px',
                        background: entry.level === 'error' ? '#1c1317' : undefined,
                        borderColor: entry.level === 'error' ? 'rgba(229, 9, 20, 0.4)' : undefined
                      }}
                    >
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                        <span className="mono" style={{ fontSize: 11, color: 'var(--text-sub)' }}>[{entry.time}]</span>
                        <span className={`badge ${entry.level === 'error' ? 'badge-red' : entry.level === 'success' ? 'badge-emerald' : 'badge-blue'}`} style={{ fontSize: 10, padding: '2px 8px' }}>
                          {entry.level.toUpperCase()}
                        </span>
                        <span style={{ fontSize: 13, fontWeight: 700, color: '#ffffff' }}>{entry.title}</span>
                      </div>
                      <div className="mono" style={{ fontSize: 12, color: 'var(--text-muted)', wordBreak: 'break-all' }}>
                        {entry.message}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Video Player Modal */}
          {playerModal.open && (
            <div className="modal-backdrop" onClick={() => setPlayerModal({ open: false, url: '', title: '', server: '' })}>
              <div className="modal-box" onClick={e => e.stopPropagation()}>
                <div style={{ padding: '16px 20px', borderBottom: '1px solid var(--card-border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <div>
                    <h3 style={{ fontSize: 15, fontWeight: 700, color: '#ffffff' }}>{playerModal.title}</h3>
                    <span style={{ fontSize: 12, color: 'var(--text-sub)' }}>{playerModal.server}</span>
                  </div>
                  <button className="btn btn-ghost" style={{ padding: 6 }} onClick={() => setPlayerModal({ open: false, url: '', title: '', server: '' })}>
                    <Icons.Close />
                  </button>
                </div>

                <div style={{ padding: 20, background: '#000000' }}>
                  <video
                    src={playerModal.url}
                    controls
                    autoPlay
                    playsInline
                    style={{ width: '100%', maxHeight: '520px', borderRadius: 'var(--radius-sm)', background: '#000' }}
                  />
                </div>

                <div style={{ padding: '14px 20px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
                  <div className="mono" style={{ fontSize: 11, color: 'var(--text-sub)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 450 }}>
                    {playerModal.url}
                  </div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <a href={`vlc://${playerModal.url}`} className="btn btn-solid" style={{ fontSize: 12 }}>
                      Open in VLC
                    </a>
                    <a href={playerModal.url} target="_blank" download className="btn btn-primary" style={{ fontSize: 12 }}>
                      Download
                    </a>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
