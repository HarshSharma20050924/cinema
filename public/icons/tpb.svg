<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tpb-hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5a2b"/>
      <stop offset="50%" stop-color="#5c3a1e"/>
      <stop offset="100%" stop-color="#3d2311"/>
    </linearGradient>
    <linearGradient id="tpb-sail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#d4c5b3"/>
    </linearGradient>
    <linearGradient id="tpb-sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#004e92"/>
    </linearGradient>
    <linearGradient id="tpb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f242d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background rounded pill -->
  <rect width="64" height="64" rx="14" fill="url(#tpb-bg)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Waves -->
  <path d="M 6 51 C 14 47, 18 53, 26 50 C 34 47, 40 52, 48 49 C 54 47, 58 50, 60 51 L 60 58 C 60 60, 58 60, 56 60 L 8 60 C 6 60, 6 58, 6 58 Z" fill="url(#tpb-sea)" opacity="0.85"/>

  <!-- Ship Hull -->
  <path d="M 12 43 C 14 49, 22 53, 34 53 C 44 53, 51 49, 54 44 C 54 44, 48 45, 33 45 C 18 45, 12 43, 12 43 Z" fill="url(#tpb-hull)"/>
  <polygon points="53,44 57,41 52,43" fill="#e0a96d"/>

  <!-- Main Masts -->
  <line x1="23" y1="20" x2="23" y2="45" stroke="#3d2311" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34" y1="13" x2="34" y2="45" stroke="#3d2311" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="45" y1="22" x2="45" y2="44" stroke="#3d2311" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Bowsprit -->
  <line x1="48" y1="44" x2="59" y2="38" stroke="#3d2311" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Fore Sail (Left) -->
  <path d="M 17 26 Q 23 23, 23 35 Q 19 36, 17 26 Z" fill="url(#tpb-sail)" stroke="#3d2311" stroke-width="0.7"/>
  <path d="M 18 36 Q 23 34, 23 43 Q 19 44, 18 36 Z" fill="url(#tpb-sail)" stroke="#3d2311" stroke-width="0.7"/>

  <!-- Main Sail (Center, Big) with Jolly Roger Skull -->
  <path d="M 27 18 Q 34 14, 34 29 Q 29 30, 27 18 Z" fill="url(#tpb-sail)" stroke="#3d2311" stroke-width="0.8"/>
  <path d="M 27 30 Q 34 26, 34 43 Q 28 44, 27 30 Z" fill="url(#tpb-sail)" stroke="#3d2311" stroke-width="0.8"/>

  <!-- Mizzen Sail (Right) -->
  <path d="M 38 27 Q 45 24, 45 36 Q 41 37, 38 27 Z" fill="url(#tpb-sail)" stroke="#3d2311" stroke-width="0.7"/>
  <path d="M 39 37 Q 45 35, 45 43 Q 41 44, 39 37 Z" fill="url(#tpb-sail)" stroke="#3d2311" stroke-width="0.7"/>

  <!-- Pirate Flag atop Main Mast -->
  <path d="M 34 13 L 42 16 L 34 19 Z" fill="#111111"/>
  <!-- Skull dot on flag -->
  <circle cx="37" cy="16" r="1.3" fill="#ffffff"/>
</svg>
