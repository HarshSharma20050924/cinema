name: Build Cinema Mobile Apps (Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 1. Build Cinema Web and Mobile Wrapper (Cinema Main)
      - name: Build Web App Dist
        run: |
          npm ci || npm install
          npm run build

      - name: Build Cinema Web Mobile App
        working-directory: mobile-app
        run: |
          npm ci || npm install
          rm -rf dist
          cp -r ../dist ./dist
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../Cinema-Web.apk

      # 2. Build Cinema Node Runner Android App
      - name: Build Cinema Node Runner Android App
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Cinema-Runner.apk

      # 3. Build Cinema Alternative Native Mobile App
      - name: Build Cinema Alternative Native App
        working-directory: vega-app
        run: |
          npm ci || npm install
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          UNIVERSAL_APK=$(find app/build/outputs/apk/release -name "*universal*.apk" | head -n 1)
          if [ -n "$UNIVERSAL_APK" ]; then
            cp "$UNIVERSAL_APK" ../../Cinema.apk
          else
            ANY_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            cp "$ANY_APK" ../../Cinema.apk
          fi

      - name: Upload Artifacts (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: cinema-mobile-apks
          path: |
            Cinema-Web.apk
            Cinema-Runner.apk
            Cinema.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v4.0.9' }}
          files: |
            Cinema-Web.apk
            Cinema-Runner.apk
            Cinema.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
