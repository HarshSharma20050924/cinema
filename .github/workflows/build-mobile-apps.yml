name: Build Cinema Mobile Apps (Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 1. Build Cinema Web and Mobile Wrapper (Cinema Main)
      - name: Build Web App Dist
        run: |
          npm ci || npm install
          npm run build

      - name: Build Cinema Web Mobile App
        working-directory: mobile-app
        run: |
          npm ci || npm install
          rm -rf dist
          cp -r ../dist ./dist
          for m in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$m
            cp ../public/logo.png android/app/src/main/res/mipmap-$m/ic_launcher.png
            cp ../public/logo.png android/app/src/main/res/mipmap-$m/ic_launcher_round.png
            cp ../public/logo.png android/app/src/main/res/mipmap-$m/ic_launcher_foreground.png
          done
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          APK_FOUND=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FOUND" ]; then
            cp "$APK_FOUND" ../../Cinema-Web.apk
            cp "$APK_FOUND" ../../Cinema.apk
          fi

      # 2. Build Cinema Node Runner Android App
      - name: Build Cinema Node Runner Android App
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r runner-app/public/* android/app/src/main/assets/public/
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          RUNNER_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RUNNER_APK" ]; then
            cp "$RUNNER_APK" ../Cinema-Runner.apk
          fi

      # 3. Build Cinema Alternative Native Mobile App
      - name: Build Cinema Alternative Native App
        run: |
          if [ -d "vega-app" ] && [ -f "vega-app/package.json" ]; then
            cd vega-app
            npm ci || npm install
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
            UNIVERSAL_APK=$(find app/build/outputs/apk/release -name "*universal*.apk" | head -n 1)
            if [ -n "$UNIVERSAL_APK" ]; then
              cp "$UNIVERSAL_APK" ../../Cinema.apk
            else
              ANY_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
              [ -n "$ANY_APK" ] && cp "$ANY_APK" ../../Cinema.apk || true
            fi
          else
            echo "Alternative app source not present, skipping."
          fi

      - name: Resolve Dynamic Release Tag
        id: vars
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          if [ -z "$TAG" ]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      - name: Upload Artifacts (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: cinema-mobile-apks
          path: |
            Cinema-Web.apk
            Cinema-Runner.apk
            Cinema*.apk
          if-no-files-found: warn

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          files: |
            Cinema-Web.apk
            Cinema-Runner.apk
            Cinema*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
