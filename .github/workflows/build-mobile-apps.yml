name: Build Cinema Mobile Apps (Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web App
        run: |
          npm ci || npm install
          npm run build

      - name: Build Cinema Web Mobile App
        working-directory: mobile-app
        run: |
          npm ci || npm install
          rm -rf dist
          cp -r ../dist ./dist
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../Cinema-Web.apk

      - name: Build Cinema Node Runner Android App
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Cinema-Runner.apk

      - name: Upload Artifacts (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: cinema-mobile-apks
          path: |
            Cinema-Web.apk
            Cinema-Runner.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v4.0.9' }}
          files: |
            Cinema-Web.apk
            Cinema-Runner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
