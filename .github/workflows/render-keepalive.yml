name: Render 24/7 Cluster Keep-Alive

on:
  schedule:
    # Run every 8 minutes (well under Render's 15-minute inactivity limit)
    - cron: '*/8 * * * *'
  workflow_dispatch:

jobs:
  ping-render-cluster:
    name: Ping All 5 Render Cluster Instances
    runs-on: ubuntu-latest
    steps:
      - name: Health Check & Keep-Alive Ping
        run: |
          SERVERS=(
            "https://cinema-4h7t.onrender.com"
            "https://cinema-1-zjrx.onrender.com"
            "https://cinema-2-mg14.onrender.com"
            "https://cinema-3-euoh.onrender.com"
            "https://cinema-4-260y.onrender.com"
          )

          echo "🚀 Pinging all 5 Render cluster instances to prevent idle sleep..."
          for url in "${SERVERS[@]}"; do
            echo -n "Pinging $url ... "
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 25 "$url/api/health" || echo "FAIL")
            if [ "$STATUS" = "200" ]; then
              echo "✅ OK (HTTP $STATUS)"
            else
              echo "⚠️ $STATUS (Waking up via /api/providers)..."
              curl -s -o /dev/null -w "%{http_code}" -m 40 "$url/api/providers" || echo "Cold Start In Progress"
            fi
          done
          echo "🎉 All Render nodes pinged successfully."
