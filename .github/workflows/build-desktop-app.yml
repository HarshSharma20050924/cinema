name: Build Cinema Desktop App (Windows, Mac, Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Desktop Dependencies
        working-directory: desktop-app
        run: npm ci || npm install

      - name: Build Application Package
        working-directory: desktop-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            npm run dist:win
          elif [ "$RUNNER_OS" == "macOS" ]; then
            npm run dist:mac
          else
            npm run dist:linux
          fi
        shell: bash

      - name: Upload Artifacts (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: cinema-desktop-${{ matrix.os }}
          path: |
            desktop-app/release/*.exe
            desktop-app/release/*.AppImage
            desktop-app/release/*.deb
            desktop-app/release/*.dmg
            desktop-app/release/*.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v4.1.0' }}
          files: |
            desktop-app/release/*.exe
            desktop-app/release/*.AppImage
            desktop-app/release/*.deb
            desktop-app/release/*.dmg
            desktop-app/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
