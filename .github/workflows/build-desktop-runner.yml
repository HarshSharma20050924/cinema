name: Build Cinema Desktop Runner (Windows, Mac, Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: desktop-runner
        run: npm ci || npm install

      - name: Build Application Package
        working-directory: desktop-runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            npm run dist:win
          elif [ "$RUNNER_OS" == "macOS" ]; then
            npm run dist:mac
          else
            npm run dist:linux
          fi
        shell: bash

      - name: Upload Artifacts (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: cinema-desktop-runner-${{ matrix.os }}
          path: |
            desktop-runner/release/*.exe
            desktop-runner/release/*.AppImage
            desktop-runner/release/*.dmg
            desktop-runner/release/*.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-runner/release/*.exe
            desktop-runner/release/*.AppImage
            desktop-runner/release/*.dmg
            desktop-runner/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
